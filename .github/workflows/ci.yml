name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - uses: actions/cache@v4
        with:
          path: /tmp/noir-mongodb-binaries
          key: ${{ runner.os }}-mongodb-8.2.6
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high
        working-directory: client
      - run: npm audit --audit-level=high
        working-directory: server
